<header><div class="wrap nav"><a class="brand" href="/"><b class="logo">≋</b>Kural Orders</a></div></header><main class="wrap"><div class="intro"><p class="eyebrow">STORE OWNER</p><h1>Order counter settings</h1></div><section class="input"><form id="settings"><label>Owner access code<input id="code" type="password" autocomplete="current-password" required></label><label>Store name<input id="name" maxlength="60" required></label><label>WhatsApp number with country code<input id="phone" type="tel" placeholder="+91…" required></label><button class="solid">Save settings</button><p id="msg" role="status"></p></form></section><section class="review"><h2>Groq voice transcription</h2><form id="groqForm"><label>Owner access code<input id="groqOwner" type="password" required autocomplete="current-password"></label><label>Groq API key<input id="groqKey" type="password" required autocomplete="off" placeholder="gsk_…"></label><button class="solid">Connect Groq</button><p id="groqStatus" role="status"></p></form></section><section class="review"><h2>Gemini voice transcription</h2><form id="geminiForm"><label>Owner access code<input id="geminiOwner" type="password" required autocomplete="current-password"></label><label>Gemini API key<input id="geminiKey" type="password" required autocomplete="off" placeholder="Google AI Studio key"></label><button class="solid">Connect Gemini</button><p id="geminiStatus" role="status"></p></form></section><section class="review"><h2>Sarvam voice transcription</h2><form id="sarvamForm"><label>Owner access code<input id="sarvamOwner" type="password" required autocomplete="current-password"></label><label>Sarvam API key<input id="sarvamKey" type="password" required autocomplete="off" placeholder="Sarvam subscription key"></label><button class="solid">Connect Sarvam</button><p id="sarvamStatus" role="status"></p></form></section><section class="review printable"><h2>Scan to order</h2><img src="/qr.svg" width="200" height="200" alt="QR code for the order counter"><br><button onclick="print()">Print QR code</button></section></main>
<script>
fetch('/settings').then(r=>r.json()).then(v=>{document.querySelector('#name').value=v.name;phone.value=v.phone}).catch(()=>msg.textContent='Settings could not be loaded.');
groqForm.onsubmit=async e=>{
 e.preventDefault();groqStatus.textContent='Checking key…';
 try{const r=await fetch('/owner/groq',{method:'POST',headers:{Authorization:'Bearer '+groqOwner.value},body:groqKey.value});groqStatus.textContent=await r.text();if(r.ok){groqKey.value='';groqOwner.value=''}}catch{groqStatus.textContent='Connection failed. Try again.'}
};
geminiForm.onsubmit=async e=>{
 e.preventDefault();geminiStatus.textContent='Checking key…';
 try{const r=await fetch('/owner/gemini',{method:'POST',headers:{Authorization:'Bearer '+geminiOwner.value},body:geminiKey.value});geminiStatus.textContent=await r.text();if(r.ok){geminiKey.value='';geminiOwner.value=''}}catch{geminiStatus.textContent='Connection failed. Try again.'}
};
sarvamForm.onsubmit=async e=>{
 e.preventDefault();sarvamStatus.textContent='Saving key…';
 try{const r=await fetch('/owner/sarvam',{method:'POST',headers:{Authorization:'Bearer '+sarvamOwner.value},body:sarvamKey.value});sarvamStatus.textContent=await r.text();if(r.ok){sarvamKey.value='';sarvamOwner.value=''}}catch{sarvamStatus.textContent='Connection failed. Try again.'}
};
settings.onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/settings',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+code.value},body:JSON.stringify({name:document.querySelector('#name').value,phone:phone.value})});msg.textContent=await r.text();if(r.ok)code.value=''}catch{msg.textContent='Connection failed. Try again.'}};
</script>
